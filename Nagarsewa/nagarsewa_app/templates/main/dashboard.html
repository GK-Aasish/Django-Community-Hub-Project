<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard UI</title>
    {% load static %}
    <link href="{% static 'src/styles.css' %}" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-gray-50">
    <div class="flex h-screen">
      <aside class="w-64 bg-white border-r border-gray-200 flex flex-col p-4">
        <div class="flex items-center space-x-2 px-2 mb-6">
          <i class="fa-solid fa-handshake-angle text-indigo-500 text-3xl"></i>
          <span class="text-xl font-semibold text-gray-800">Nagar-Sewa</span>
        </div>

        <nav class="space-y-1">
          <a
            href="{% url 'dashboard' %}"
            class="flex items-center px-3 py-2 text-gray-700 bg-sky-100 hover:bg-sky-200 rounded-lg"
          >
            <i class="fa-solid fa-users mr-3"></i> Dashboard
          </a>
          <a
            href="#"
            class="flex items-center px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg"
          >
            <i class="fa-solid fa-folder mr-3"></i> Meetings
          </a>

          <a
            href="#"
            class="flex items-center px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg"
          >
            <i class="fa-solid fa-calendar-days mr-3"></i> Event
          </a>

          <a
            href="#"
            class="flex items-center px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg"
          >
            <i class="fa-solid fa-file-alt mr-3"></i> Notice
          </a>
        </nav>

        <div class="mt-auto pt-4">
          <a
            href="{% url 'user_settings' %}"
            class="flex items-center px-3 py-2 text-indigo-600 bg-indigo-50 rounded-lg font-medium"
          >
            <div
              class="flex items-center justify-between w-full cursor-pointer"
            >
              <div class="flex items-center space-x-2">
                <img
                  src="https://i.pravatar.cc/40"
                  class="h-8 w-8 rounded-full"
                />
                <span class="text-gray-800 font-semibold">Tom Cook</span>
              </div>

              <i class="fa-solid fa-chevron-down h-4 text-gray-700 ml-3"></i>
            </div>
          </a>
        </div>
      </aside>

      <main class="flex-1 flex flex-col">
        <section class="p-6 overflow-y-auto">
          <div
            class="w-full h-[680px] bg-white border border-dashed border-gray-300 rounded-xl p-6 overflow-y-auto"
          >
            <h2 class="text-2xl font-semibold mb-4">Dashboard</h2>
            <p class="text-gray-600">
              Welcome to the dashboard! Here you can find an overview of your
              application.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
